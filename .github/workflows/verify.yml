name: Verify clean Krillion game
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check v2/app.js
      - run: node --check v2/public/player.js
      - run: node --check v2/public/host.js
