name: Verify game build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: node --check server.js
      - run: node --check public/player.js
      - run: node --check public/host.js
      - run: node --check public/screen.js
