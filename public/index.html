<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One in a Krillion • Play</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap narrow"><header class="row between"><div class="brand">ONE IN A <span>KRILLION</span></div><span class="tag">BM EDITION</span></header><section class="hero"><div class="eyebrow">Think rare. Score big.</div><h1>Easy question.<br>Impossible answer.</h1><p class="muted">Think of a valid answer nobody else will think of. The rarer, the better.</p></section><div id="join" class="card stack"><h2>Join the game</h2><div class="field"><label>6-digit game PIN</label><input id="pin" placeholder="123456" maxlength="6" inputmode="numeric"></div><div class="field"><label>Your full name</label><input id="name" maxlength="80" placeholder="Your name"></div><div class="field"><label>College</label><input id="college" maxlength="120" placeholder="Your college"></div><div class="field"><label>Participant ID</label><input id="reg" maxlength="60" placeholder="BM-001"></div><button id="joinBtn">Join competition →</button></div><div id="game" class="hidden stack"><div class="card"><div class="row between"><span id="status" class="tag"></span><span id="count" class="muted"></span></div><h2 id="question" style="font-size:2.5rem;margin:24px 0"></h2><div id="clock" class="big-number"></div><div class="progress"><div id="bar"></div></div><form id="answerForm" class="section stack"><input id="answer" placeholder="Your rarest valid answer..." maxlength="150" autocomplete="off" required><button>Lock in my answer →</button></form><div id="submitted" class="hidden good section">✓ Answer submitted. You cannot change it now.</div><div id="message" class="muted section"></div></div><div class="card"><h2>Leaderboard</h2><div id="leaderboard" class="muted">Scores appear after the host's reveal.</div></div></div><div id="error" class="alert hidden section"></div><footer class="section muted"><a href="/host">Host control</a></footer></div><script src="/socket.io/socket.io.js"></script><script src="/player.js"></script></body></html>
